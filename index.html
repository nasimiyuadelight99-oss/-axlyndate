<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AxlynDate</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;font-family:system-ui,sans-serif}
.hero{position:relative;width:100%;height:100dvh;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;object-position:center 20%}
.overlay{position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,.88) 0%, rgba(0,0,0,.35) 60%, rgba(0,0,0,.08) 100%)}
.top{position:absolute;top:14px;left:16px;z-index:2;display:flex;align-items:center;gap:8px;color:#fff;font-weight:700}
.logo{width:34px;height:34px;background:linear-gradient(135deg,#F1D9A5,#C9A86A);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#000;font-weight:800}
.badge{position:absolute;top:66px;right:14px;z-index:2;background:#fff;color:#111;padding:7px 12px;border-radius:20px;font-size:11px;font-weight:800}
.bottom{position:absolute;bottom:0;left:0;right:0;z-index:2;padding:20px 18px}
.bottom h4{font-size:10px;letter-spacing:2.5px;color:rgba(255,255,255,.85)}
.bottom h1{font-size:33px;line-height:1.05;color:#fff;margin:8px 0 10px;font-weight:800}
.bottom p{font-size:13px;color:rgba(255,255,255,.9);margin-bottom:18px}
.btn{width:100%;height:54px;border-radius:28px;border:none;font-weight:800;font-size:14px;margin-top:10px;cursor:pointer}
.white{background:#fff;color:#111}
.gold{background:linear-gradient(90deg,#E8C99A,#F1D9A5,#C9A86A);color:#000;box-shadow:0 0 0 1.5px rgba(255,255,255,.6), 0 10px 28px rgba(232,201,154,.55)}
.ghost{background:rgba(255,255,255,.14);color:#fff;border:1.5px solid rgba(255,255,255,.7);backdrop-filter:blur(8px)}
</style>
</head>
<body>
<div class="hero">
<!-- LUXURY DIRECT LINK - no download needed - blazer + rooftop lounge -->
<img src="https://images.pexels.com/photos/3772510/pexels-photo-3772510.jpeg?auto=compress&cs=tinysrgb&w=900" alt="Luxury">
<div class="overlay"></div>
<div class="top"><div class="logo">AX</div> axlyndate</div>
<div class="badge">💛 2,847 couples matched</div>
<div class="bottom">
<h4>VERIFIED & ELEGANT</h4>
<h1>Meet Your<br>Luxury Love</h1>
<p>Real connections with verified singles who get your lifestyle</p>
<button class="btn white" onclick="location.href='discover.html'">Continue with Google</button>
<button class="btn gold" onclick="location.href='discover.html'">Find Your Match →</button>
<button class="btn ghost" onclick="location.href='discover.html'">Login</button>
</div>
</div>
</body>
</html>
