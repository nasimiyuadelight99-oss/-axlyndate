<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AxlynDate</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#FDFBF7;display:flex;justify-content:center}
.phone{width:100%;max-width:390px;min-height:100vh;background:#FDFBF7;display:flex;flex-direction:column;padding:24px 22px 18px}
.top{text-align:center}
.logo{width:78px;height:78px;background:linear-gradient(135deg,#E8C99A,#C9A86A,#F1D9A5,#C8A46B);border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto}
.logo span{font-family:'Cormorant Garamond',serif;font-size:36px;color:#1A1A1A}
h1{font-family:'Cormorant Garamond',serif;font-size:26px;color:#2B1E12;margin-top:14px}
.sub{font-size:11px;color:#7A6A58;margin-top:4px}
.hero{width:100%;border-radius:26px;overflow:hidden;position:relative;height:380px;box-shadow:0 12px 30px rgba(0,0,0,.15);background:#111;margin:20px 0 auto}
.hero img{width:100%;height:100%;object-fit:cover}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,.65) 0%, transparent 60%)}
.hero-text{position:absolute;bottom:16px;left:18px;color:#fff;z-index:2}
.hero-text b{font-size:16px;display:block}.hero-text i{font-size:12px;opacity:.95;font-style:normal;margin-top:2px;display:block}
.badge{position:absolute;top:14px;right:14px;background:#fff;color:#111;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:700;z-index:2}
.btns{margin-top:28px}
.btn{width:100%;height:52px;border-radius:28px;border:none;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;margin:10px 0}
.google{background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.08);color:#111;border:1px solid #eee}
.gold{background:linear-gradient(90deg,#D7B97C,#E8D2A0,#C9A86A);color:#000}
.outline{background:transparent;border:1.2px solid #C9A86A;color:#7A6A58}
.foot{font-size:10px;color:#9A8A7A;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="phone">
<div class="top">
<div class="logo"><span>AX</span></div>
<h1>Meet Your Luxury Love</h1>
<div class="sub">Verified & elegant • 2,847 success stories</div>
</div>

<div class="hero">
<div class="badge">💛 98% Success Rate</div>
<!-- 100% SAFE - HAPPY CLOTHED COUPLE IN SUIT & DRESS -->
<img src="https://images.pexels.com/photos/1024993/pexels-photo-1024993.jpeg?auto=compress&cs=tinysrgb&w=600" alt="Luxury Couple">
<div class="hero-text">
<b>Find Yours Today</b>
<i>Join verified singles worldwide</i>
</div>
</div>

<div class="btns">
<button class="btn google" onclick="location.href='discover.html'"><img src="https://www.svgrepo.com/show/475656/google-color.svg" width="20"> Continue with Google</button>
<button class="btn gold" onclick="location.href='discover.html'">Sign Up</button>
<button class="btn outline" onclick="location.href='discover.html'">Login</button>
<div class="foot">By continuing, you agree to our Terms & Privacy Policy</div>
</div>
</div>
</body>
</html>
