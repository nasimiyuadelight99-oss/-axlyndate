<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AxlynDate</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;font-family:system-ui,-apple-system;overflow:hidden}
.hero{position:relative;width:100%;height:100dvh;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;z-index:1}
.overlay{position:absolute;inset:0;z-index:2;background:linear-gradient(to bottom,rgba(0,0,0,.6) 0%,rgba(0,0,0,.1) 35%,rgba(0,0,0,.75) 70%,rgba(0,0,0,.9) 100%)}
.top{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;color:#fff;font-weight:700}
.brand{display:flex;align-items:center;gap:8px;font-size:13px}
.logo{width:30px;height:30px;background:linear-gradient(135deg,#F1D9A5,#C9A86A);border-radius:7px;display:grid;place-items:center;color:#000;font-weight:900}
.badge{background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(8px);padding:5px 10px;border-radius:20px;font-size:10px}
.bottom{position:relative;z-index:3;padding:12px 14px calc(16px + env(safe-area-inset-bottom))}
.kicker{color:#E8C99A;font-size:9.5px;letter-spacing:1.8px;font-weight:700;margin-bottom:6px}
.bottom h1{color:#fff;font-size:28px;line-height:1.05;font-weight:800}
.sub{color:rgba(255,255,255,.85);font-size:12.5px;margin-top:6px;line-height:1.3}
.btn{width:100%;height:44px;border-radius:24px;border:none;font-weight:800;margin-top:8px;font-size:13px}
</style>
</head>
<body>
<div class="hero">
<img src="hero.jpg?v=16" alt="Luxury">
<div class="overlay"></div>
<div class="top">
<div class="brand"><div class="logo">AX</div> axlyndate</div>
<div class="badge">2,847 couples matched</div>
</div>
<div class="bottom">
<div class="kicker">✓ VERIFIED • ELEGANT • REAL CONNECTIONS</div>
<h1>Meet Your<br>Luxury Love</h1>
<div class="sub">Real connections with verified singles in Muscat & beyond</div>
<button class="btn" style="background:#fff;color:#111">Continue with Google</button>
<button class="btn" style="background:linear-gradient(90deg,#E8C99A,#C9A86A);color:#000">Find Your Match →</button>
<button class="btn" style="background:rgba(255,255,255,.14);color:#fff;border:1.5px solid rgba(255,255,255,.6)">Login</button>
</div>
</div>
</body>
</html>
