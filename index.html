<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AxlynDate</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a1931;color:#fff;font-family:sans-serif}
header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff15}
.logo{border:1.5px solid #e6c9a8;color:#e6c9a8;width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:10px;font-weight:800}
button{padding:9px 16px;border-radius:20px;border:none;font-weight:700}
.gold{background:#e6c9a8;color:#0a1931}
.dark{background:#132845;color:#fff;border:1px solid #ffffff20!important}
.hero{padding:26px 16px}
.badge{font-size:9px;letter-spacing:2px;opacity:.5;border:1px solid #ffffff15;padding:6px 10px;border-radius:20px;display:inline-block}
h1{font-size:30px;margin:12px 0}
h1 i{color:#e6c9a8;font-weight:300}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 90px}
.card{background:#132845;border-radius:18px;overflow:hidden;border:1px solid #ffffff12}
.img{height:110px;background:#1a3253;display:flex;align-items:center;justify-content:center;font-size:32px}
.info{padding:10px;font-size:13px}
#m{position:fixed;inset:0;background:#000000a0;backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:99;padding:16px}
#m.show{display:flex}
.box{background:#132845;width:100%;max-width:340px;border-radius:20px;padding:22px;border:1px solid #ffffff20}
.box input{width:100%;padding:12px;border-radius:12px;background:#1a3253;border:1px solid #ffffff15;color:#fff;margin-bottom:10px}
</style>
</head><body>
<header><div class="logo">AX</div><div><button class="dark" onclick="openM()">Login</button> <button class="gold" onclick="openM()">Join Free</button></div></header>
<div class="hero"><div class="badge">LUXURY • REAL • SAFE • VERIFIED</div><h1>Find Your <i>Luxury Love</i></h1><p style="opacity:.6;font-size:13px">Premium dating for real connections. No fakes — only verified people.</p></div>
<div class="grid">
<div class="card"><div class="img">💎</div><div class="info"><b>Sophia, 24</b><br><span style="opacity:.5;font-size:11px">Dubai • Verified</span></div></div>
<div class="card"><div class="img">🌹</div><div class="info"><b>James, 28</b><br><span style="opacity:.5;font-size:11px">London • Premium</span></div></div>
</div>
<div id="m"><div class="box">
<div style="text-align:center;color:#e6c9a8;font-weight:800;margin-bottom:8px">AX — AxlynDate</div>
<h2 style="text-align:center">Welcome</h2>
<p style="text-align:center;opacity:.5;font-size:11px;margin:6px 0 16px">Create free account</p>
<input placeholder="Email"><input placeholder="Password" type="password">
<button class="gold" style="width:100%;margin-top:6px">Create Account — Free</button>
<button class="dark" style="width:100%;margin-top:8px" onclick="closeM()">Close</button>
</div></div>
<script>function openM(){document.getElementById('m').classList.add('show')}function closeM(){document.getElementById('m').classList.remove('show')}</script>
</body></html>
