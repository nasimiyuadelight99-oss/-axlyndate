<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AxlynDate</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000}
.hero{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;object-position:center 30%}
.overlay{position:absolute;inset:0;background:linear-gradient(to bottom, rgba(0,0,0,.05) 0%, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 75%, rgba(0,0,0,.88) 100%)}
.top{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;padding:16px 20px}
.logo{width:38px;height:38px;background:linear-gradient(135deg,#E8C99A,#C9A86A);border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-weight:600;color:#000}
.brand{color:#fff;margin-left:9px;font-weight:600}
.badge{position:absolute;top:70px;right:16px;z-index:3;background:#fff;color:#111;padding:7px 14px;border-radius:20px;font-size:11px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.bottom{position:absolute;bottom:0;left:0;right:0;z-index:3;padding:22px 20px}
.bottom h4{font-family:'Cormorant Garamond',serif;color:rgba(255,255,255,.9);letter-spacing:2.5px;font-size:11px}
.bottom h1{color:#fff;font-size:32px;line-height:1.05;font-weight:800;margin:10px 0 12px;letter-spacing:-.5px}
.bottom p{color:rgba(255,255,255,.88);font-size:14px;line-height:1.4;margin-bottom:20px;max-width:300px}
.btn{width:100%;height:54px;border-radius:28px;border:none;font-weight:700;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;margin-bottom:11px;transition:.2s}
.white{background:#fff;color:#111;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.white img{width:20px;height:20px}
.gold{background:linear-gradient(90deg,#E3C07A,#F5DDA0,#C9A86A);color:#000;box-shadow:0 8px 24px rgba(201,168,106,.45);transform:scale(1.02);border:1.5px solid rgba(255,255,255,.4)}
.gold:active{transform:scale(.98)}
.ghost{background:rgba(255,255,255,.12);color:#fff;border:1.5px solid rgba(255,255,255,.65);backdrop-filter:blur(10px)}
.small{font-size:11px;color:rgba(255,255,255,.75);text-align:center;margin-top:8px;line-height:1.3}
</style>
</head>
<body>
<div class="hero">
<!-- FIX 2: ZOOMED OUT LUXURY - chest-up, rooftop resort, NOT cropped face -->
<img src="https://images.pexels.com/photos/3778577/pexels-photo-3778577.jpeg?auto=compress&cs=tinysrgb&w=900" alt="Luxury happy couple resort">

<div class="overlay"></div>

<div class="top">
<div class="logo">AX</div>
<div class="brand">axlyndate</div>
</div>

<div class="badge">💛 2,847 couples matched</div>

<div class="bottom">
<h4>VERIFIED & ELEGANT</h4>
<h1>Meet Your<br>Luxury Love</h1>
<p>Real connections with verified singles who get your lifestyle</p>

<!-- FIX 1: GOOGLE BUTTON FIXED - clean G logo, no red cut -->
<button class="btn white" onclick="location.href='discover.html'">
<img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="G">
Continue with Google
</button>

<!-- FIX: Main CTA pops more -->
<button class="btn gold" onclick="location.href='discover.html'">Find Your Match →</button>
<button class="btn ghost" onclick="location.href='discover.html'">Login</button>

<!-- FIX 3: CONTRAST FIXED - brighter, readable -->
<div class="small">By continuing, you agree to Terms & Privacy Policy</div>
</div>
</div>
</body>
</html>
