<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AxlynDate - Luxury Dating</title>
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a1931;color:#fff;font-family:system-ui;min-height:100vh}
header{position:sticky;top:0;background:#0a1931cc;backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.08);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{width:40px;height:40px;border:1.5px solid #e6c9a8;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#e6c9a8;font-weight:800}
.navbtn button{background:#132845;border:1px solid rgba(255,255,255,.12);color:#fff;padding:8px 14px;border-radius:20px;font-size:12px}
.navbtn button.gold{background:#e6c9a8;color:#0a1931;border:none;font-weight:700}
.hero{padding:24px 16px}
.badge{font-size:9px;letter-spacing:2px;color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.1);display:inline-block;padding:5px 10px;border-radius:20px}
.hero h1{font-size:28px;margin:12px 0 8px}
.hero h1 span{color:#e6c9a8;font-style:italic;font-weight:300}
.hero p{color:rgba(255,255,255,.55);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 100px}
.card{background:#132845;border:1px solid rgba(255,255,255,.1);border-radius:18px;overflow:hidden}
.card .img{height:120px;background:linear-gradient(135deg,#1a3253,#0a1931);display:flex;align-items:center;justify-content:center;font-size:32px}
.card .info{padding:10px}
#loginModal{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#loginModal.show{display:flex}
.modalbox{width:100%;max-width:360px;background:#132845;border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:24px}
.modalbox input{width:100%;background:#1a3253;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px;color:#fff;margin-bottom:10px}
.modalbox button{width:100%;border-radius:12px;padding:12px;border:none;font-weight:700;margin-top:6px}
.btnGold{background:#e6c9a8;color:#0a1931}
.btnDark{background:#1a3253;color:#fff;border:1px solid rgba(255,255,255,.1)!important}
</style>
</head>
<body>
<header>
<div class="logo">AX</div>
<div class="navbtn">
<button onclick="openLogin()">Login</button>
<button class="gold" onclick="openLogin()">Join Free</button>
</div>
</header>
<div class="hero">
<div class="badge">LUXURY • REAL • SAFE • VERIFIED</div>
<h1>Find Your <span>Luxury Love</span></h1>
<p>Premium dating for real connections. No fakes — only verified people.</p>
</div>
<div class="grid">
<div class="card"><div class="img">💎</div><div class="info"><b>Sophia, 24</b><div style="font-size:11px;opacity:.5">Dubai • Verified</div></div></div>
<div class="card"><div class="img">🌹</div><div class="info"><b>James, 28</b><div style="font-size:11px;opacity:.5">London • Premium</div></div></div>
<div class="card"><div class="img">✨</div><div class="info"><b>Aisha, 26</b><div style="font-size:11px;opacity:.5">Doha • Real</div></div></div>
<div class="card"><div class="img">🔥</div><div class="info"><b>David, 30</b><div style="font-size:11px;opacity:.5">Muscat • Verified</div></div></div>
</div>
<div id="loginModal">
<div class="modalbox">
<div style="text-align:center;margin-bottom:12px;color:#e6c9a8;font-weight:800">AX — AxlynDate</div>
<h2 style="text-align:center">Welcome</h2>
<p style="text-align:center;font-size:11px;opacity:.5;margin:6px 0 18px">Create free account</p>
<input id="email" type="email" placeholder="Email address">
<input id="pass" type="password" placeholder="Password">
<button class="btnGold">Create Account — Free</button>
<button class="btnDark" onclick="closeLogin()">Close</button>
</div>
</div>
<script>
function openLogin(){document.getElementById('loginModal').classList.add('show')}
function closeLogin(){document.getElementById('loginModal').classList.remove('show')}
</script>
</body>
</html>
