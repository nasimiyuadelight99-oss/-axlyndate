<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AxlynDate</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;background:#0a1931;height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.bg{position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1520854221256-17451ccdf07b?w=1200') center/cover;opacity:0.35}
.overlay{position:absolute;inset:0;background:linear-gradient(to top,#0a1931 40%,rgba(10,25,49,.2))}
.content{position:relative;z-index:2;text-align:center;padding:25px;width:100%;max-width:360px}

h1{font-size:30px;font-weight:900;line-height:1.1;margin-bottom:8px;color:#fff}
p{color:#bbb;font-size:13px;margin-bottom:28px}
.btn{width:100%;padding:14px;border-radius:30px;font-weight:800;font-size:14px;border:none;cursor:pointer;margin:7px 0;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-white{background:#fff;color:#000}
.btn-gold{background:linear-gradient(135deg,#d4af37,#f5e6c8);color:#0a1931}
.btn-outline{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff}
.small{font-size:10px;color:#888;margin-top:18px;line-height:1.4}
</style>
</head>
<body>
<div class="bg"></div><div class="overlay"></div>
<div class="content">

<h1>Meet Your Luxury Love</h1>
<p>Verified & elegant singles</p>
<button class="btn btn-white"> <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="18"> Continue with Google</button>
<button class="btn btn-gold" onclick="location.href='discover.html'">Sign Up</button>
<button class="btn btn-outline" onclick="location.href='discover.html'">Login</button>
<p class="small">By continuing, you agree to our Terms & Privacy Policy.</p>
</div>
</body>
</html>
