<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AxlynDate</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F8F3EB;font-family:'Inter',sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{width:100%;max-width:390px;background:#F8F3EB;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:70px 30px}
.logo{width:118px;height:118px;background:linear-gradient(145deg,#B9975B,#E9D5A3,#C4A26A,#E6CC8A);border-radius:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(185,151,91,.35)}
.logo b{font-family:'Cormorant Garamond',serif;font-size:56px;font-weight:500;color:#1a1a1a;letter-spacing:-1px}
.title{font-family:'Cormorant Garamond',serif;font-size:30px;color:#4A3728;margin-top:38px;font-weight:500;letter-spacing:.2px}
.sub{font-size:13px;color:#6B5D52;margin-top:8px}
.btns{width:100%;margin-top:45px}
.btn{width:100%;height:56px;border-radius:28px;border:none;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0}
.g{background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.07);color:#222;border:1px solid #f0e8db}
.gold{background:linear-gradient(90deg,#C6A46F,#E5C99E,#C6A46F);color:#1a1a1a;box-shadow:0 6px 20px rgba(198,164,111,.4)}
.out{background:transparent;border:1px solid #C6A46F;color:#6B5D52}
.foot{font-size:10px;color:#9A8C80;margin-top:18px;text-align:center}
</style>
</head>
<body>
<div class="card">
<div style="text-align:center">
<div class="logo"><b>AX</b></div>
<div class="title">Meet Your Luxury Love</div>
<div class="sub">Verified & elegant singles</div>
</div>
<div class="btns">
<button class="btn g"><img src="https://www.svgrepo.com/show/475656/google-color.svg" width="20"> Continue with Google</button>
<button class="btn gold" onclick="location.href='discover.html'">Sign Up</button>
<button class="btn out" onclick="location.href='discover.html'">Login</button>
<div class="foot">By continuing, you agree to our Terms & Privacy Policy</div>
</div>
</div>
</body>
</html>
