<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AxlynDate</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;font-family:system-ui,-apple-system}
.hero{position:relative;width:100%;height:100dvh;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;z-index:1}
.overlay{position:absolute;inset:0;z-index:2;background:linear-gradient(to bottom,rgba(0,0,0,.45) 0%,rgba(0,0,0,.05) 35%,rgba(0,0,0,.75) 75%,rgba(0,0,0,.95) 100%)}
.top{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:16px;color:#fff;font-weight:700}
.brand{display:flex;align-items:center;gap:8px}
.logo{width:34px;height:34px;background:linear-gradient(135deg,#F1D9A5,#C9A86A);border-radius:8px;display:grid;place-items:center;color:#000;font-weight:900}
.badge{background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(8px);padding:6px 12px;border-radius:20px;font-size:11px}
.bottom{position:relative;z-index:3;padding:20px 18px 24px}
.kicker{color:#E8C99A;font-size:11px;letter-spacing:2px;font-weight:700;margin-bottom:8px}
.bottom h1{color:#fff;font-size:34px;line-height:1.05;font-weight:800;text-shadow:0 2px 20px rgba(0,0,0,.8)}
.sub{color:rgba(255,255,255,.85);font-size:14px;margin-top:10px}
.btn{width:100%;height:52px;border-radius:28px;border:none;font-weight:800;margin-top:12px;font-size:15px}
</style>
</head>
<body>
<div class="hero">
<img src="hero.jpg?v=14" alt="Luxury">
<div class="overlay"></div>
<div class="top">
<div class="brand"><div class="logo">AX</div> axlyndate</div>
<div class="badge">2,847 couples matched</div>
</div>
<div class="bottom">
<div class="kicker">✓ VERIFIED • ELEGANT • REAL CONNECTIONS</div>
<h1>Meet Your<br>Luxury Love</h1>
<div class="sub">Where ambitious minds meet elegant hearts in Muscat & beyond</div>
<button class="btn" style="background:#fff">Continue with Google</button>
<button class="btn" style="background:linear-gradient(90deg,#E8C99A,#C9A86A)">Find Your Match →</button>
<button class="btn" style="background:rgba(255,255,255,.14);color:#fff;border:1.5px solid rgba(255,255,255,.6)">Login</button>
</div>
</div>
</body>
</html>
