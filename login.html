<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AX - Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a1931;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui;padding:16px}
.card{width:100%;max-width:380px;background:#132845;border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:28px}
.logo{width:56px;height:56px;border:1.5px solid #e6c9a8;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;color:#e6c9a8;font-weight:800;letter-spacing:3px}
.small{font-size:8px;letter-spacing:3px;color:rgba(255,255,255,.4);text-align:center;margin-bottom:14px}
h1{color:#fff;font-size:21px;text-align:center}
.sub{color:rgba(255,255,255,.5);font-size:11px;text-align:center;margin:6px 0 20px}
input{width:100%;background:#1a3253;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:13px 14px;color:#fff;margin-bottom:12px}
button{width:100%;border-radius:12px;padding:13px;border:none;font-weight:700;cursor:pointer}
.gold{background:#e6c9a8;color:#0a1931}
.dark{background:#1a3253;color:#fff;border:1px solid rgba(255,255,255,.1);margin-top:10px}
.back{text-align:center;margin-top:16px}
.back a{color:rgba(255,255,255,.5);font-size:11px;text-decoration:none}
</style>
</head>
<body>
<div class="card">
<div class="logo">AX</div>
<div class="small">LUXURY • REAL • SAFE</div>
<h1>Welcome to AxlynDate</h1>
<div class="sub">Premium dating — Sign up to find real love</div>
<input id="email" placeholder="Email address">
<input id="pass" type="password" placeholder="Password (6+ characters)">
<button class="gold" onclick="location.href='index.html'">Create Account — Free</button>
<button class="dark" onclick="location.href='index.html'">I have an account — Login</button>
<div class="back"><a href="index.html">← Back to Home</a></div>
</div>
</body>
</html>
