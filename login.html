<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AxlynDate - Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;background:#0a0a0a;color:white}
h1{font-family:'Playfair Display',serif}
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-black via-zinc-900 to-black">
<div class="w-full max-w-md bg-white/5 backdrop-blur-xl border border-white/10 rounded-[2rem] p-8 shadow-2xl">
<div class="text-center mb-8">
<h1 class="text-4xl font-bold tracking-widest mb-2">AXLYN<span class="text-amber-400">DATE</span></h1>
<p class="text-zinc-400 text-sm">Luxury Dating - Sign in to continue</p>
</div>
<input id="email" type="email" placeholder="Email address" class="w-full mb-4 px-5 py-4 rounded-2xl bg-white/5 border border-white/10 focus:border-amber-400 outline-none text-white placeholder-zinc-500">
<input id="password" type="password" placeholder="Password (min 6 chars)" class="w-full mb-6 px-5 py-4 rounded-2xl bg-white/5 border border-white/10 focus:border-amber-400 outline-none text-white placeholder-zinc-500">
<button id="signupBtn" class="w-full py-4 rounded-2xl bg-amber-400 text-black font-bold text-lg hover:bg-amber-300 transition mb-3">Create Account — Free</button>
<button id="loginBtn" class="w-full py-4 rounded-2xl bg-white/10 text-white font-semibold hover:bg-white/20 transition">Sign In</button>
<p id="msg" class="mt-6 text-center text-sm min-h-[20px]"></p>
<p class="mt-8 text-center text-xs text-zinc-500"><a href="index.html" class="underline hover:text-white">← Back to Home</a></p>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyBKWR779VOSiaMZNhK6IBCCDDCpOkrFvQE",
  authDomain: "axlyndate.firebaseapp.com",
  projectId: "axlyndate",
  storageBucket: "axlyndate.firebasestorage.app",
  messagingSenderId: "629882385131",
  appId: "1:629882385131:web:61e96d7148c4fd0048c4ae"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const emailEl = document.getElementById('email');
const passEl = document.getElementById('password');
const msgEl = document.getElementById('msg');
function showMsg(t, isError=false){
 msgEl.textContent = t;
 msgEl.className = "mt-6 text-center text-sm min-h-[20px] " + (isError? "text-red-400" : "text-green-400");
}
document.getElementById('signupBtn').onclick = async () => {
 const email = emailEl.value.trim();
 const pass = passEl.value;
 if(!email ||!pass){ showMsg("❌ Enter email and password", true); return; }
 showMsg("Creating account...");
 try{
  await createUserWithEmailAndPassword(auth, email, pass);
  showMsg("✅ Welcome! Account created!");
  setTimeout(()=>{ window.location.href = "index.html"; }, 1200);
 }catch(e){ showMsg("❌ " + e.message, true); }
};
document.getElementById('loginBtn').onclick = async () => {
 const email = emailEl.value.trim();
 const pass = passEl.value;
 if(!email ||!pass){ showMsg("❌ Enter email and password", true); return; }
 showMsg("Signing in...");
 try{
  await signInWithEmailAndPassword(auth, email, pass);
  showMsg("✅ Welcome back!");
  setTimeout(()=>{ window.location.href = "index.html"; }, 800);
 }catch(e){ showMsg("❌ " + e.message, true); }
};
</script>
</body>
</html>
